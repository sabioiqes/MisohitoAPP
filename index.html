let currentFocus = null;
let currentAllowHeart = false;
function wordDomain(w) {
  return (typeof WORD_DOMAIN !== "undefined" && WORD_DOMAIN[w.s]) || "共通";
}
function pickNoun(mora) {
  const pool = NOUNS[mora] || [];
  if (!currentFocus) return pick(pool);
  const filtered = pool.filter((w) => {
    const d = wordDomain(w);
    return d === currentFocus || d === "共通" || (currentAllowHeart && d === "心");
  });
  return pick(filtered.length ? filtered : pool);
}
function pickVerb(mora) { return pick(VERBS[mora]); }
function pickAdj(mora) { return pick(ADJS[mora]); }


// 名詞の分類と、「の」でつながる場合の相性（続きやすさの重み）
// 同じ分類の景物同士（星の月など）は重みを下げ、属性（光・影・色など）は上げる
const NOUN_CLASS = {
  "日": "天体", "夜": "時刻",
  "月": "天体", "星": "天体", "空": "天体", "雪": "気象", "雨": "気象", "雲": "気象", "風": "気象",
  "花": "植物", "山": "地形", "川": "地形", "海": "地形", "峰": "地形", "岩": "地形", "里": "地形",
  "秋": "季節", "夏": "季節", "夢": "心情", "声": "属性", "香": "属性", "影": "属性",
  "霞": "気象", "夕べ": "時刻", "朝日": "天体", "桜": "植物", "紅葉": "植物", "桂": "植物",
  "心": "心情", "光": "属性", "森": "地形", "続き": "属性",
  "夕焼け": "気象", "白雲": "気象", "通ひ路": "属性",
};
function compatWeight(n1, n2) {
  const c1 = NOUN_CLASS[n1.s], c2 = NOUN_CLASS[n2.s];
  if (!c1 || !c2) return 1;
  if (c2 === "属性") return 2;
  if (c1 === "季節") return c2 === "時刻" ? 1.5 : 1.2;
  if (c1 === c2) return (c1 === "地形" || c1 === "時刻") ? 0.2 : 0.1;
  if (c1 === "心情") return 0.4;
  if (c1 === "天体" && c2 === "時刻") return 1.2;
  return 1;
}
function pickNounAfterNo(mora, n1) {
  const pool = NOUNS[mora] || [];
  let candidates = pool;
  if (currentFocus) {
    const filtered = pool.filter((w) => {
      const d = wordDomain(w);
      return d === currentFocus || d === "共通" || (currentAllowHeart && d === "心");
    });
    if (filtered.length) candidates = filtered;
  }
  return weightedPick(candidates, candidates.map((w) => compatWeight(n1, w)));
}


// 動詞の枠：名詞の分類と助詞の組み合わせごとに、続きやすい動詞を重みで寄せる
// （花が→咲く、花を→見る、のような「名詞＋助詞→動詞」の相性。分類経由なので語彙の増加に比例する作業で済む）
const FRAMES = {
  "降る": { subj: ["気象"], ni: ["地形"] },
  "照る": { subj: ["天体", "気象"], ni: ["地形", "植物"] },
  "散る": { subj: ["植物", "気象"], ni: ["地形"] },
  "鳴く": { subj: ["属性"], ni: ["地形", "時刻"] },
  "見る": { wo: ["天体", "気象", "地形", "植物", "季節", "時刻", "心情", "属性"] },
  "更く": { subj: ["時刻"] },
  "吹く": { subj: ["気象"], ni: ["植物", "地形"] },
  "匂ふ": { subj: ["植物", "属性"] },
  "渡る": { subj: ["気象", "心情"], ni: ["地形", "天体"] },
  "残る": { subj: ["属性", "気象", "心情"], ni: ["地形", "時刻"] },
  "たなびく": { subj: ["気象"] },
  "ふけゆく": { subj: ["時刻"] },
  "照るらむ": { subj: ["天体", "気象"] },
  "散りゆく": { subj: ["植物", "気象"] },
  "吹きゆく": { subj: ["気象"] },
  "降りつつ": { subj: ["気象"] },
  "流るる": { subj: ["天体", "気象", "地形"] },
  "降りしく": { subj: ["気象"] },
  "散るらむ": { subj: ["植物", "気象"] },
  "降るらむ": { subj: ["気象"] },
  "吹くらむ": { subj: ["気象"] },
  "待つらむ": { wo: ["心情"] },
  "見るらむ": { wo: ["天体", "気象", "地形", "植物", "季節", "時刻", "心情", "属性"] },
  "恋ふらむ": { wo: ["心情"] },
};
function weightedPick(pool, weights) {
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}
function pickVerbFor(mora, frame, noun) {
  const pool = VERBS[mora] || [];
  const weights = pool.map((v) => {
    const f = FRAMES[v.s];
    if (!f || !f[frame]) return 1;
    return f[frame].includes(NOUN_CLASS[noun.s]) ? 3 : 0.25;
  });
  return weightedPick(pool, weights);
}

const KU5_TEMPLATES = [
  () => { const n1 = pickNoun(2); return [n1, NO, pickNounAfterNo(2, n1)]; },

const END_TEMPLATES = [
  () => { const n1 = pickNoun(2); return [n1, NO, pickVerbFor(4, "subj", n1)]; },

];

function buildKu5() {
  if (Math.random() < 0.15) return pick(KU5);
  return pick(KU5_TEMPLATES)();
}
function buildKu7() {
  if (Math.random() < 0.15) return pick(KU7);
  return pick(KU7_TEMPLATES)();
}
function buildKu7End() {
  if (Math.random() < 0.15) return pick(KU7_END);
  return pick(END_TEMPLATES)();
}

function countMora(reading) {
  let n = 0;
  for (const ch of reading) { if (!SMALL.has(ch)) n += 1; }
  return n;
}
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];


// 同じ語・同じ動詞の重なりを避けるための判定
const PARTICLES = new Set(["の", "は", "に", "を", "も", "て", "ぞ", "まで", "より"]);
const STEM = {
  "照る": "照る", "照るらむ": "照る",
  "散る": "散る", "散るらむ": "散る", "散りゆく": "散る",
  "降る": "降る", "降るらむ": "降る", "降りつつ": "降る", "降りしく": "降る", "降りしけ": "降る", "降らぬか": "降る",
  "吹きしく": "吹く", "吹きゆく": "吹く", "吹くらむ": "吹く",
  "流るる": "流る", "流るらむ": "流る",
  "更く": "更く", "ふけゆく": "更く", "更けにける": "更く",
  "見る": "見る", "見るらむ": "見る", "見し": "見る",
  "待つらむ": "待つ", "恋ふらむ": "恋ふ",
  "立つ": "立つ", "立たぬ": "立つ", "春立つ": "春立つ",
  "変はらず": "変はる", "経る": "経る", "むす": "むす", "干す": "干す", "咲く": "咲く", "鳴く": "鳴く", "まがふ": "まがふ",
};
function hasRepeat(kus) {
  const seen = new Set();
  for (const ku of kus) {
    for (const w of ku) {
      if (PARTICLES.has(w.s)) continue;
      const key = STEM[w.s] || w.s;
      if (seen.has(key)) return true;
      seen.add(key);
    }
  }
  return false;
}


// 歌全体の軸（景色の領域）。句ごとに独立に引くと景色の名詞が競合して焦点が消えるため、
// まず軸を1つ決めて、各句はその軸か中立の材料から引く
const WORD_DOMAIN = {
  "月": "空", "星": "空", "空": "空", "雲": "空", "霞": "空", "雪": "空", "雨": "空", "夕焼け": "空", "天": "空", "桂": "空", "雲ゐ": "空", "朝日": "空", "白雲": "空",
  "山": "山", "峰": "山", "岩": "山", "山鳥": "山", "木末": "山", "しづく": "山", "猟夫": "山", "木": "山", "苔": "山",
  "海": "水", "川": "水",
  "花": "花", "桜": "花", "梅": "花", "紅葉": "花", "紫": "花",
  "夢": "心", "君": "心", "心": "心",
};
const DOMAIN_NAMES = { "空": "空の景色", "山": "山の景色", "水": "水辺", "花": "花", "心": "心情" };
function kuDomain(ku) {
  for (const w of ku) {
    if (PARTICLES.has(w.s)) continue;
    if (WORD_DOMAIN[w.s]) return WORD_DOMAIN[w.s];
  }
  return "共通";
}
function pickWithFocus(buildFn, focus, allowHeart) {
  let last = null;
  for (let t = 0; t < 12; t++) {
    currentAllowHeart = allowHeart;
    const ku = buildFn();
    last = ku;
    const d = kuDomain(ku);
    if (d === focus || d === "共通") return ku;
    if (allowHeart && d === "心") return ku;
  }
  return last;
}

function moraOfWords(words) { return countMora(words.map((w) => w.r).join("")); }
// 文節グラフ：枕詞 → 頭の文節 → 続きの文節、と枝をたどって句を組み立てる。
// 登録の単位は文節（頭と続きの別々の配列）。元の組み合わせは pairs に記録され太い枝（重み2）、
// 同じ枕詞の中での組み替えは細い枝（重み1）。
function buildTargetKu(makura) {
  const head = pick(makura.heads);
  const headText = head.map((w) => w.s).join("");
  const rest = 7 - moraOfWords(head);
  const cands = makura.tails.filter((t) => moraOfWords(t) === rest);
  if (!cands.length) return null;
  const pairSet = new Set(makura.pairs.map((p) => p[0] + "|" + p[1]));
  const tail = weightedPick(cands, cands.map((t) => (pairSet.has(headText + "|" + t.map((w) => w.s).join("")) ? 2 : 1)));
  const ku = [...head, ...tail];
  ku.headText = headText;
  ku.tailText = tail.map((w) => w.s).join("");
  ku.recombined = !pairSet.has(headText + "|" + ku.tailText);
  return ku;
}

function generate(mode) {
  for (let attempt = 0; attempt < 100; attempt++) {
    const useMakura = mode === "with" ? true : mode === "without" ? false : Math.random() < 0.5;
    if (!useMakura) {
      const focus = pick(Object.keys(DOMAIN_NAMES));
      currentFocus = focus;
      currentAllowHeart = false;
      const kusFree = [
        pickWithFocus(buildKu5, focus, false),
        pickWithFocus(buildKu7, focus, false),
        pickWithFocus(buildKu5, focus, false),
        pickWithFocus(buildKu7, focus, false),
        pickWithFocus(buildKu7End, focus, true),
      ];
      currentFocus = null;
      const expectedFree = [5, 7, 5, 7, 7];
      const okFree = kusFree.every((ku, i) => countMora(ku.map((w) => w.r).join("")) === expectedFree[i]);
      if (okFree && !hasRepeat(kusFree)) {
        return { kus: kusFree, steps: [
          "型を引く：枕詞なし型",
          "歌の軸を引く：景色は「" + DOMAIN_NAMES[focus] + "」でそろえる",
          "各句を、軸に合う部品の組み合わせで組み立てる（結句だけ心情への転換も許す）",
          "検証：読みの音数が 5-7-5-7-7 に一致したので、この歌で確定",
        ]};
      }
      continue;
    }
    const pillowFirst = Math.random() < 0.5;
    const makura = pick(MAKURA);
    const targetKu = buildTargetKu(makura);
    if (!targetKu) continue;
    const kus = pillowFirst
      ? [[makura.word], targetKu, buildKu5(), buildKu7(), buildKu7End()]
      : [buildKu5(), buildKu7(), [makura.word], targetKu, buildKu7End()];
    const expected = [5, 7, 5, 7, 7];
    const ok = kus.every((ku, i) => countMora(ku.map((w) => w.r).join("")) === expected[i]);
    if (ok && !hasRepeat(kus)) {
      const targetWord = targetKu[0];
      const targetMora = countMora(targetWord.r);
      const rest = targetKu.slice(1);
      const steps = [
        "型を引く：" + (pillowFirst ? "初句型（枕詞が初句に来る）" : "三句型（枕詞が三句に来る）"),
        "枕詞を引く：候補" + MAKURA.length + "種から「" + makura.word.s + "」（5音で句が埋まる）",
        "頭の文節を引く：「" + makura.word.s + "」から枝をたどって「" + (targetKu.headText || targetWord.s) + "」（" + targetMora + "音）",
        "文節をつなぐ：頭の文節「" + (targetKu.headText || targetWord.s) + "」に、続きの文節「" + (targetKu.tailText || rest.map((w) => w.s).join("")) + "」を枝から引いてつなぐ" + (targetKu.recombined ? "（元の組み合わせではない、枝の組み替え）" : "（用意した組み合わせの枝）"),
        "残りの句も、音数の合う候補から引いて埋める",
        "検証：読みの音数が 5-7-5-7-7 に一致したので、この歌で確定",
      ];
      return { kus, steps };
    }
  }
  throw new Error("生成に失敗しました");
}

let selected = null;
let currentKus = null;

function poemTextHorizontal() {
  return currentKus.map((ku) => ku.map((w) => w.s).join("")).join("　");
}
function poemTextPseudoVertical() {
  const cols = currentKus.map((ku) => Array.from(ku.map((w) => w.s).join("")));
  const rows = Math.max(...cols.map((c) => c.length));
  const lines = [];
  for (let r = 0; r < rows; r++) {
    const cells = [];
    for (let c = cols.length - 1; c >= 0; c--) {
      cells.push(cols[c][r] !== undefined ? cols[c][r] : "　");
    }
    lines.push(cells.join("　").replace(/　+$/, ""));
  }
  return lines.join("\n");
}
async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const el = document.getElementById("copyMsg");
  el.textContent = msg;
  setTimeout(() => { el.textContent = ""; }, 2000);
}
function showGloss(word, el) {
  if (selected) selected.classList.remove("selected");
  selected = el;
  el.classList.add("selected");
  document.getElementById("gloss").innerHTML =
    '<span class="surface"></span><span class="reading"></span><div class="modern"></div>';
  document.querySelector("#gloss .surface").textContent = word.s;
  document.querySelector("#gloss .reading").textContent = "（" + word.r + "）";
  document.querySelector("#gloss .modern").textContent = "現代語では：" + word.g;
}

function render() {
  const result = generate(document.getElementById("makuraMode").value);
  const kus = result.kus;
  currentKus = kus;
  const stepsOl = document.getElementById("steps");
  stepsOl.innerHTML = "";
  result.steps.forEach((s) => {
    const li = document.createElement("li");
    li.textContent = s;
    stepsOl.appendChild(li);
  });
  const poem = document.getElementById("poem");
  poem.innerHTML = "";
  kus.forEach((ku) => {
    const kuDiv = document.createElement("div");
    kuDiv.className = "ku";
    ku.forEach((word) => {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = word.s;
      span.addEventListener("click", () => showGloss(word, span));
      kuDiv.appendChild(span);
    });
    poem.appendChild(kuDiv);
  });
  selected = null;
  document.getElementById("gloss").innerHTML =
    '<span class="hint">単語を押すと、ここに現代語訳が出ます。</span>';
}

document.getElementById("generate").addEventListener("click", render);
document.getElementById("copyNormal").addEventListener("click", () => copyText(poemTextHorizontal(), "横書きでコピーしました"));
document.getElementById("copyPseudo").addEventListener("click", () => copyText(poemTextPseudoVertical(), "疑似縦書きでコピーしました"));
render();
</script>
</body>
</html>
